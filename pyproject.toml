[project]
name = "dfw-forecasting"
version = "0.1.0"
description = "Project exploring data engineering concepts as well as forecasting models"
readme = "README.md"
authors = [
    { name = "lwinger04" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "python-dateutil>=3.0.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E","W","F","I","B","UP"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
